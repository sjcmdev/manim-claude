      - {source: "_2018/div_curl", file: "div_curl.py", line: 2808}
    confidence: high
    applies_to: "Gdy identyczny updater ma obsługiwać kilka grup z różnymi źródłami danych."

  - id: animation-2018-div-curl-tracker-jako-zrodlo-prawdy
    topic: stan-i-updatery
    rule: "Aktualizuj odczyty liczbowe przez bieżący getter trackera lub obiektu źródłowego i nie integruj ich osobnym dt."
    falsifiable: true
    evidence:
      - {source: "_2018/div_curl", file: "div_curl.py", line: 1616}
      - {source: "_2018/div_curl", file: "div_curl.py", line: 1619}
      - {source: "_2018/div_curl", file: "div_curl.py", line: 2826}
    confidence: high
    applies_to: "Gdy liczba na ekranie ma odzwierciedlać tracker albo wartość wyliczaną z położenia."

  - id: referencja-do-wylaczenia-updatera
    topic: stan-i-updatery
    rule: "Zachowuj referencję do updatera, jeśli późniejsza faza ma go usunąć przed zmianą roli obiektu."
    falsifiable: true
    evidence:
      - {source: "_2018/div_curl", file: "div_curl.py", line: 1819}
      - {source: "_2018/div_curl", file: "div_curl.py", line: 1910}
      - {source: "_2018/div_curl", file: "div_curl.py", line: 3865}
    confidence: high
    applies_to: "Gdy obiekt przechodzi z trybu dynamicznego do statycznego albo do innej interpretacji."

  - id: bez-wlasnej-klasy-animation
    topic: klasy-animacji
    rule: "Składaj ruch z gotowych animacji i metod sceny, zamiast definiować podklasę Animation z własnym przebiegiem interpolacji."
    falsifiable: true
    evidence:
      - {source: "_2018/div_curl", file: "div_curl.py", line: 161}
      - {source: "_2018/div_curl", file: "div_curl.py", line: 474}
      - {source: "_2018/div_curl", file: "div_curl.py", line: 721}
    confidence: high
    applies_to: "Gdy efekt można uzyskać przez równoległe gotowe animacje, Transform albo updater."

  - id: rownolegle-animacje-jednego-zdarzenia
    topic: klasy-animacji
    rule: "Łącz wejście geometrii, wejście adnotacji i powiązaną zmianę stanu w jednym self.play, gdy opisują jedno zdarzenie wizualne."
    falsifiable: true
    evidence:
      - {source: "_2018/div_curl", file: "div_curl.py", line: 474}
      - {source: "_2018/div_curl", file: "div_curl.py", line: 784}
      - {source: "_2018/div_curl", file: "div_curl.py", line: 2501}
    confidence: high
    applies_to: "Gdy kilka elementów powinno rozpocząć i zakończyć przejście jako jeden gest."

  - id: zakrzywiona-sciezka-transformacji
    topic: klasy-animacji
    rule: "Dodawaj path_arc do transformacji, gdy relacja przestrzenna między stanem źródłowym i docelowym wymaga ruchu po łuku."
    falsifiable: true
    evidence:
      - {source: "_2018/div_curl", file: "div_curl.py", line: 237}
      - {source: "_2018/div_curl", file: "div_curl.py", line: 337}
    confidence: high
    applies_to: "Gdy prostoliniowa interpolacja zaciera kierunek albo znaczenie przejścia."

  - id: there-and-back-dla-akcentu
    topic: klasy-animacji
    rule: "Stosuj rate_func=there_and_back do chwilowych akcentów, które mają wrócić do poprzedniego wyglądu."
    falsifiable: true
    evidence:
      - {source: "_2018/div_curl", file: "div_curl.py", line: 484}
      - {source: "_2018/div_curl", file: "div_curl.py", line: 2144}
      - {source: "_2018/div_curl", file: "div_curl.py", line: 3515}
    confidence: high
    applies_to: "Gdy animacja ma chwilowo pokazać próbkę, kolor, grubość albo wartość bez pozostawiania zmiany."

  - id: linear-dla-ruchu-parametrycznego
    topic: klasy-animacji
    rule: "Ustawiaj rate_func=linear, gdy czas animacji ma równomiernie odpowiadać parametrowi drogi lub kąta."
    falsifiable: true
