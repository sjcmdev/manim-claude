observations:
  - id: pozycyjny-updater-bez-dt
    topic: stan-i-updatery
    rule: "Buduj updater zależności pozycyjnej bez parametru dt i wyprowadzaj położenie z aktualnego stanu obiektu źródłowego."
    falsifiable: true
    evidence:
      - {source: "_2018/div_curl", file: "div_curl.py", line: 435}
      - {source: "_2018/div_curl", file: "div_curl.py", line: 2291}
      - {source: "_2018/div_curl", file: "div_curl.py", line: 834}
    confidence: high
    applies_to: "Gdy obiekt ma jedynie podążać za punktem, okręgiem albo innym obiektem zależnym."

  - id: dt-do-ruchu-stanowego
    topic: stan-i-updatery
    rule: "Przy ruchu stanowym przyjmuj dt, przechowuj stan poprzedniej klatki na mobject i aktualizuj go przyrostowo."
    falsifiable: true
    evidence:
      - {source: "_2018/div_curl", file: "div_curl.py", line: 368}
      - {source: "_2018/div_curl", file: "div_curl.py", line: 177}
      - {source: "_2018/div_curl", file: "div_curl.py", line: 1307}
    confidence: high
    applies_to: "Gdy pozycja zależy od prędkości, fazy albo skumulowanego czasu."

  - id: dynamiczna-geometria-z-bieznego-stanu
    topic: stan-i-updatery
    rule: "Odtwarzaj geometrię zależną od zmiennych obiektów z ich bieżącego stanu i stosuj natychmiastowy Transform zamiast kumulować ręczne przesunięcia."
    falsifiable: true
    evidence:
      - {source: "_2018/div_curl", file: "div_curl.py", line: 1302}
      - {source: "_2018/div_curl", file: "div_curl.py", line: 1819}
      - {source: "_2018/div_curl", file: "div_curl.py", line: 1895}
    confidence: high
    applies_to: "Gdy kształt pola, wektora albo pierścienia zależy od aktualnych punktów lub funkcji."

  - id: fabryka-updatera
    topic: stan-i-updatery
    rule: "Zamykaj wspólny algorytm aktualizacji w fabryce closure, przekazując jej tylko getter źródłowej wartości."
    falsifiable: true
    evidence:
