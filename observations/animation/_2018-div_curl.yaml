    applies_to: "Gdy nowy obiekt reprezentuje kontynuację starego, a nie całkowicie nowy element kadru."

  - id: przygaszanie-zamiast-usuwania-kontekstu
    topic: wejscie-i-sprzatanie
    rule: "Przygaszaj wcześniejsze równania lub elementy kontekstu przez zmianę opacity, jeśli mają pozostać czytelne jako tło."
