      - {source: "_2018/div_curl", file: "div_curl.py", line: 4236}
    confidence: high
    applies_to: "Gdy płynność easing nie powinna zmieniać tempa opisu ruchu."

  - id: geometria-glowna-przed-adnotacja
    topic: wejscie-i-sprzatanie
    rule: "Wprowadzaj obiekt główny przez wzrost lub rysowanie, a adnotacje przez Write, FadeIn albo FadeInFromDown."
    falsifiable: true
    evidence:
      - {source: "_2018/div_curl", file: "div_curl.py", line: 1479}
      - {source: "_2018/div_curl", file: "div_curl.py", line: 2321}
      - {source: "_2018/div_curl", file: "div_curl.py", line: 2754}
    confidence: high
    applies_to: "Gdy obiekt ma najpierw ustanowić zjawisko, a tekst dopiero nazwać lub objaśnić jego rolę."

  - id: tymczasowy-slad-z-kontrolowanym-zniszczeniem
    topic: wejscie-i-sprzatanie
    rule: "Buduj tymczasowe ślady na kopii obiektu, wyróżniaj je kolorem i prowadź przez ShowCreationThenDestruction albo podobny cykl tworzenia i zaniku."
    falsifiable: true
    evidence:
      - {source: "_2018/div_curl", file: "div_curl.py", line: 515}
      - {source: "_2018/div_curl", file: "div_curl.py", line: 547}
      - {source: "_2018/div_curl", file: "div_curl.py", line: 1886}
    confidence: high
    applies_to: "Gdy linia ma pokazać chwilowy przepływ lub konstrukcję, a nie zostać na kolejną fazę."

  - id: transformacja-w-nastepny-obiekt
    topic: wejscie-i-sprzatanie
    rule: "Przekształcaj obiekt w jego pojęciowego następcę, a niezależne etykiety i komentarze wygaszaj osobno."
    falsifiable: true
    evidence:
