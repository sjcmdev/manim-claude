    applies_to: "Obowiązuje przy przechodzeniu od wzoru lub obiektu do jego przekształconej postaci."

  - id: jawny-luk-rotacyjny
    topic: klasy-animacji
    rule: "Ustawiaj jawny łuk przejścia dla odpowiadających sobie punktów na okręgu i ograniczaj jego wartość w iterowanych ruchach."
    falsifiable: true
