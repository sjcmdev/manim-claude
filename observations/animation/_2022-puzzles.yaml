    confidence: medium
    applies_to: "Obowiązuje w tym materiale, w którym nie zdefiniowano własnej klasy dziedziczącej po `Animation`."

  - id: zachowuj-zrodlo-przy-transformacji
    topic: klasy-animacji
    rule: "Zachowuj obiekt źródłowy, gdy nowa reprezentacja ma być pokazana jako jego odpowiednik, i prowadź przejście z jego kopii."
    falsifiable: true
    evidence:
