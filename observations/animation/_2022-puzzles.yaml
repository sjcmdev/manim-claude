observations:
  - id: animation-2022-puzzles-tracker-bez-dt
    topic: stan-i-updatery
    rule: "W updaterze sterowanym trackerem odczytuj bieżącą wartość trackera lub geometrię źródła i nie przyjmuj `dt`."
    falsifiable: true
    evidence:
      - {source: _2022/puzzles, file: subsets.py, line: 2067}
      - {source: _2022/puzzles, file: subsets.py, line: 2144}
      - {source: _2022/puzzles, file: subsets.py, line: 3716}
    confidence: high
    applies_to: "Obowiązuje, gdy położenie obiektu wynika z zewnętrznego stanu, a nie z upływu czasu."

  - id: dt-tylko-akumulacja
    topic: stan-i-updatery
    rule: "Używaj `dt` tylko do integrowania przyrostu ruchu zależnego od czasu, takiego jak ciągły obrót ramki."
    falsifiable: true
    evidence:
      - {source: _2022/puzzles, file: subsets.py, line: 1620}
    confidence: high
    applies_to: "Obowiązuje dla updaterów, które mają kontynuować ruch bez trackera."

  - id: geometry-from-source
    topic: stan-i-updatery
    rule: "Przeliczaj geometrię wynikową z bieżącego stanu obiektów źródłowych zamiast opierać ją na poprzednim położeniu wynikowego obiektu."
    falsifiable: true
    evidence:
      - {source: _2022/puzzles, file: subsets.py, line: 2747}
      - {source: _2022/puzzles, file: subsets.py, line: 4042}
      - {source: _2022/puzzles, file: subsets.py, line: 5091}
    confidence: high
    applies_to: "Obowiązuje dla linii, ścieżek i innych obiektów zależnych od ruchomych punktów."

  - id: tracker-przebudowuje-stan
    topic: stan-i-updatery
    rule: "Przechowuj stan dyskretny w trackerze, a w jednym updaterze aktualizuj liczby, listy submobjects i znaczniki zależne od tego stanu."
    falsifiable: true
    evidence:
      - {source: _2022/puzzles, file: subsets.py, line: 650}
      - {source: _2022/puzzles, file: subsets.py, line: 665}
      - {source: _2022/puzzles, file: subsets.py, line: 677}
    confidence: high
    applies_to: "Obowiązuje dla animacji przeglądających kolejne konfiguracje dyskretne."

  - id: grupuj-ruch-semantycznie
    topic: klasy-animacji
    rule: "Składaj ruch z osobnych animacji odpowiadających częściom semantycznym i zwracaj ich równoległą kompozycję z funkcji pomocniczej."
    falsifiable: true
    evidence:
      - {source: _2022/puzzles, file: subsets.py, line: 60}
      - {source: _2022/puzzles, file: subsets.py, line: 95}
      - {source: _2022/puzzles, file: subsets.py, line: 123}
    confidence: high
    applies_to: "Obowiązuje dla przejść obejmujących jednocześnie strukturę, wartości i elementy pomocnicze."

  - id: unikaj-wlasnej-podklasy-animation
    topic: klasy-animacji
    rule: "Zastępuj własną podklasę `Animation` kompozycją gotowych ruchów, gdy przejście składa się z niezależnych etapów lub części."
    falsifiable: true
    evidence:
