    confidence: high
    applies_to: "Obowiązuje, gdy kolejność na scenie wpływa na kolejność propagowania zależności."

  - id: transport-dla-ciaglosci
    topic: stan-i-updatery
    rule: "Dopasowuj nowe pozycje punktów przez minimalizację odległości zamiast ufać kolejności wyników funkcji wielowartościowej."
