    confidence: high
    applies_to: "Obowiązuje dla obiektów przeciąganych myszą lub ograniczanych do osi albo promienia."

  - id: always-redraw-dla-geometrii
    topic: stan-i-updatery
    rule: "Buduj geometrię całkowicie zależną od bieżącego stanu przez fabrykę `always_redraw`."
    falsifiable: true
