observations:
  - id: automatyczne-wiazanie-zaleznosci
    topic: stan-i-updatery
    rule: "Rozpoznawaj w nadpisanym `play`, która rodzina punktów jest animowana, i automatycznie przypinaj updater rodziny zależnej."
    falsifiable: true
    evidence:
      - {source: _2022/quintic, file: roots_and_coefs.py, line: 573}
    confidence: high
    applies_to: "Obowiązuje przy animowaniu samych korzeni albo samych współczynników."

  - id: updatery-bez-dt
    topic: stan-i-updatery
    rule: "Definiuj updater zależnościowy z argumentem mobject, odczytuj bieżący stan sceny lub trackera i ustawiaj wynik bez całkowania `dt`."
    falsifiable: true
    evidence:
      - {source: _2022/quintic, file: roots_and_coefs.py, line: 465}
      - {source: _2022/quintic, file: polynomial_baisics.py, line: 504}
      - {source: _2022/quintic, file: polynomial_baisics.py, line: 1045}
    confidence: high
    applies_to: "Obowiązuje dla pozycji i wartości wyliczanych z aktualnych współczynników."

  - id: nazwane-updatery-grup
    topic: stan-i-updatery
    rule: "Wydzielaj nazwany updater, gdy jedna zmiana ma przeliczać całą grupę zależnych elementów."
    falsifiable: true
    evidence:
      - {source: _2022/quintic, file: roots_and_coefs.py, line: 465}
      - {source: _2022/quintic, file: cubic.py, line: 190}
      - {source: _2022/quintic, file: polynomial_baisics.py, line: 853}
    confidence: high
    applies_to: "Obowiązuje dla grup punktów, wykresów i struktur pochodnych."

  - id: lambdy-dla-prostych-zaleznosci
    topic: stan-i-updatery
    rule: "Podpinaj lambdę w miejscu tylko dla krótkiej zależności jednego obiektu od jednego źródła."
    falsifiable: true
    evidence:
      - {source: _2022/quintic, file: roots_and_coefs.py, line: 547}
      - {source: _2022/quintic, file: polynomial_baisics.py, line: 1264}
      - {source: _2022/quintic, file: polynomial_baisics.py, line: 1336}
    confidence: high
    applies_to: "Obowiązuje dla etykiet, liczb i prostego śledzenia pozycji."

  - id: animation-2022-quintic-stan-poprzedniej-klatki
    topic: stan-i-updatery
    rule: "Przechowuj stan między klatkami i aktualizuj go przez różnicę względem poprzedniej wartości, gdy wynik ma zachować ciągłość."
    falsifiable: true
    evidence:
      - {source: _2022/quintic, file: polynomial_baisics.py, line: 1439}
    confidence: high
    applies_to: "Obowiązuje dla kąta przechodzącego przez gałąź funkcji wielowartościowej."

  - id: stan-interakcji-na-obiekcie
    topic: stan-i-updatery
    rule: "Zapisuj offset i ograniczenia interakcji jako atrybuty obiektu przed podpięciem updatera."
    falsifiable: true
