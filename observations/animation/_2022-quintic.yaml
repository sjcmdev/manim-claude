    confidence: high
    applies_to: "Obowiązuje dla wykresów i krzywych, których skład zmienia się razem z danymi."

  - id: odwrotna-kolejnosc-aktualizacji
    topic: stan-i-updatery
    rule: "Aktualizuj mobjects w odwrotnej kolejności, jeśli obiekty są ponownie dodawane podczas interakcji."
    falsifiable: true
