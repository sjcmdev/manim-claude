      - {source: _2023/clt, file: main.py, line: 1175}
      - {source: _2023/clt, file: main.py, line: 1178}
    confidence: high
    applies_to: "Obowiązuje, gdy dane można zmieniać in-place, ale przejście ma być widoczne jako zmiana całego rozkładu."

  - id: nazwane-czesci-kompozytu
    topic: custom-mobject
    rule: "Udostępniaj części kompozytu zarówno jako dzieci grupy, jak i nazwane atrybuty używane później przez scenę."
    falsifiable: true
