      - {source: _2023/clt, file: galton_board.py, line: 249}
      - {source: _2023/clt, file: galton_board.py, line: 253}
    confidence: high
    applies_to: "Obowiązuje dla wykresów, pojemników i innych grup, których części są animowane niezależnie."

  - id: get-buduje-set-mutuje
    topic: custom-mobject
    rule: "Niech funkcje get_* zwracają nowe obiekty, a metody set_* aktualizują istniejące dzieci bez tworzenia zamiennika."
