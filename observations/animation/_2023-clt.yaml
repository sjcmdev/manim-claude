      - {source: _2023/clt, file: wordy_scenes.py, line: 62}
      - {source: _2023/clt, file: galton_board.py, line: 96}
    confidence: high
    applies_to: "Obowiązuje dla kilku etykiet, strzałek lub komentarzy pojawiających się wokół jednego zdarzenia."

  - id: geometria-w-init
    topic: custom-mobject
    rule: "Buduj składowe obiektu w __init__, zachowuj osie i xs jako stan, a aktualizację danych ogranicz do zmiany wysokości istniejących części."
    falsifiable: true
    evidence:
      - {source: _2023/clt, file: main.py, line: 17}
      - {source: _2023/clt, file: main.py, line: 43}
      - {source: _2023/clt, file: main.py, line: 55}
      - {source: _2023/clt, file: main.py, line: 59}
    confidence: high
    applies_to: "Obowiązuje dla ChartBars i podobnych obiektów będących grupą parametryzowanych części."

  - id: in-place-kontra-nowy-obiekt
    topic: custom-mobject
    rule: "Rozdzielaj mutator aktualizujący istniejące części od zmiany semantycznego obiektu, dla której twórz nową grupę i transformuj starą."
    falsifiable: true
    evidence:
