    applies_to: "Obowiązuje, gdy kilka efektów ma wystąpić jednocześnie albo gdy kolejne kroki mają być odczytywane osobno."

  - id: zachowanie-ciaglosci-fragmentow
    topic: klasy-animacji
    rule: "Przy przejściu między równaniami zachowuj ciągłość wzrokową przez dopasowanie fragmentów albo transformację z kopii."
