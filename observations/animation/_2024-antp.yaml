observations:
  - id: ruch-z-dt
    topic: updatery
    rule: "W updaterze odpowiedzialnym za ciągły ruch przyjmuj `dt` i przesuwaj obiekt o prędkość pomnożoną przez `dt`."
    falsifiable: true
    evidence:
      - {source: _2024/antp, file: main.py, line: 76}
      - {source: _2024/antp, file: main.py, line: 79}
      - {source: _2024/antp, file: main.py, line: 412}
      - {source: _2024/antp, file: main.py, line: 502}
    confidence: high
    applies_to: "Obowiązuje dla przewijania obiektów lub kamery, które ma być niezależne od liczby klatek."

  - id: updater-geometria-styl
    topic: updatery
    rule: "Czytaj aktualne położenie obiektu i na jego podstawie synchronizuj geometrię części oraz styl, zamiast utrzymywać osobny tracker pozycji."
    falsifiable: true
