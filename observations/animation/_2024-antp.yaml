      - {source: _2024/antp, file: main.py, line: 76}
      - {source: _2024/antp, file: main.py, line: 412}
      - {source: _2024/antp, file: main.py, line: 502}
    confidence: high
    applies_to: "Obowiązuje, gdy updater różni się złożonością od prostego przesunięcia zależnego od `dt`."

  - id: animacje-gotowe-zamiast-klasy
    topic: klasy-animacji
    rule: "Dla zmian kilku istniejących obiektów składaj `self.play` z gotowych transformacji i efektów, zamiast tworzyć klasę dziedziczącą po `Animation`."
    falsifiable: true
    evidence:
