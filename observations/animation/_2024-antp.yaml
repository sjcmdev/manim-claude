      - {source: _2024/antp, file: main.py, line: 143}
      - {source: _2024/antp, file: main.py, line: 145}
    confidence: high
    applies_to: "Obowiązuje, gdy wygląd adnotacji ma zależeć od bieżącego położenia animowanego obiektu."

  - id: usuwanie-poza-kadrem
    topic: updatery
    rule: "Usuwaj element z grupy w updaterze po przekroczeniu granicy kadru i natychmiast pomijaj dalszą aktualizację tego elementu."
    falsifiable: true
    evidence:
