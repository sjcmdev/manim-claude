      - {source: _2024/antp, file: main.py, line: 1044}
    confidence: high
    applies_to: "Obowiązuje, gdy ruch polega na przejściu, wygaszeniu, zmianie stylu lub wejściu kilku gotowych mobjectów."

  - id: kolejnosc-play
    topic: klasy-animacji
    rule: "Łącz równoległe zmiany w jednym `self.play`, a kroki wymagające osobnego rytmu rozdzielaj na kolejne wywołania `self.play` i `wait`."
    falsifiable: true
