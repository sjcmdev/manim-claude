      - {source: _2024/antp, file: main.py, line: 54}
      - {source: _2024/antp, file: main.py, line: 55}
    confidence: high
    applies_to: "Obowiązuje dla długich strumieni obiektów przesuwających się poza widoczny obszar."

  - id: lambda-dla-prostego-ruchu
    topic: updatery
    rule: "Zapisuj jednowierszowy ruch jako lambdę, a synchronizację wielu części i zmianę stylu zamykaj w nazwanej funkcji updatera."
    falsifiable: true
