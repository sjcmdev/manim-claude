  - id: hierarchiczna-tablica
    topic: custom-mobject
    rule: "Trzymaj równolegle kontener elementów, kontener zastępników i kontener nawiasów, jeśli obiekt ma zmieniać reprezentację bez utraty układu."
    falsifiable: true
    evidence:
