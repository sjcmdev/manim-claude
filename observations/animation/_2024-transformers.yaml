  - id: parametry-w-init
    topic: custom-mobject
    rule: "Umieszczaj w `__init__` parametry geometrii, zakresów wartości i stylu, a konstruktor niech od razu buduje kompletny obiekt."
    falsifiable: true
    evidence:
