      - {source: "_2024/transformers", file: "embedding.py", line: 1662}
      - {source: "_2024/transformers", file: "embedding.py", line: 1670}
    confidence: high
    applies_to: "Sekwencji sąsiadów, przykładów lub kolejnych stanów tego samego pojęcia."

  - id: eksponuj-czesci-skladowe
    topic: custom-mobject
    rule: "Przechowuj istotne części obiektu jako atrybuty, aby późniejsza scena mogła animować je niezależnie."
    falsifiable: true
    evidence:
      - {source: "_2024/transformers", file: "helpers.py", line: 372}
      - {source: "_2024/transformers", file: "helpers.py", line: 373}
      - {source: "_2024/transformers", file: "helpers.py", line: 374}
