      - {source: "_2024/transformers", file: "helpers.py", line: 610}
      - {source: "_2024/transformers", file: "helpers.py", line: 620}
    confidence: high
    applies_to: "Tablic i sekwencji, w których część elementów jest zastępowana wielokropkiem lub innym skrótem."

  - id: mutator-kontra-animacja
    topic: custom-mobject
    rule: "Niech mutator ustawia stan obiektu, a osobna metoda zwraca gotową animację obejmującą zmianę stanu i dekoracyjny efekt."
