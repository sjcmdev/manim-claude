  - id: zostawiaj-wygaszona-historie
    topic: wejscie-i-sprzatanie
    rule: "Przy cyklicznej prezentacji podobnych elementów zostawiaj poprzedni jako przygaszoną kopię zamiast czyścić całą historię."
    falsifiable: true
    evidence:
