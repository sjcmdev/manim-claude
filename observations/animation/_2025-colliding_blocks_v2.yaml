      - {source: _2025/colliding_blocks_v2, file: blocks.py, line: 18}
      - {source: _2025/colliding_blocks_v2, file: blocks.py, line: 29}
      - {source: _2025/colliding_blocks_v2, file: blocks.py, line: 42}
