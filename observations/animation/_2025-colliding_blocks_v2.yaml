    applies_to: "Obowiązuje, gdy te same obiekty mają występować z innymi masami, rozmiarami, kolorami lub ustawieniami kamery."

  - id: fabryka-z-lokalnymi-updaterami
    topic: custom-mobject
    rule: "Fabryka wskaźnika powinna zwracać grupę z lokalnym updaterem geometrii i osobnym updaterem etykiety zależnymi od przekazanej funkcji wartości."
