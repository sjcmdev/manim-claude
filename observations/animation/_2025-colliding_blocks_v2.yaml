      - {source: _2025/colliding_blocks_v2, file: blocks.py, line: 1965}
      - {source: _2025/colliding_blocks_v2, file: supplements.py, line: 970}
    confidence: high
    applies_to: "Obowiązuje, gdy etap kończy się przejściem od rozbudowanego diagramu lub objaśnienia do jego podstawowego elementu."

