    applies_to: "Obowiązuje, gdy scena musi osobno zmieniać korpus, obrys lub etykietę obiektu."

  - id: parametry-wariantow-w-klasie
    topic: custom-mobject
    rule: "Parametry wariantów obiektu deklaruj jako atrybuty klasy, a metodę budującą utrzymuj niezależną od konkretnego wariantu."
    falsifiable: true
    evidence:
