    confidence: high
    applies_to: "Obowiązuje przy wyborze formy updatera dla zależności wewnątrz klasy i dla prostych zależności sceny."

  - id: natychmiastowa-inicjalizacja
    topic: stan-i-updatery
    rule: "Wymuś pierwsze wykonanie updatera przy podpinaniu, gdy obiekt musi być poprawny przed pierwszą klatką animacji."
    falsifiable: true
    evidence:
