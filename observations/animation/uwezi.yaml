observations:
  - id: animation-uwezi-tracker-bez-dt
    topic: stan-i-updatery
    rule: "Oddzielaj updater zależny od trackera od integratora czasu: odczytuj tracker, ale nie przyjmuj `dt`."
    falsifiable: true
    evidence:
      - {source: f27ce0a5-_x_y lines to point on curve animated_ How to animate _get_l, file: 20220918_linestopoint.py, line: 15}
      - {source: 0058db42-_scanning a magnifier over a chip_ _manim _valuetracker _ima, file: 20230604_chipmagni.py, line: 22}
    confidence: high
    applies_to: "Obowiązuje, gdy bieżąca wartość trackera jednoznacznie wyznacza położenie lub kształt."

  - id: stan-integratora
    topic: stan-i-updatery
