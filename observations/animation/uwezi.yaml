      - {source: 80eef467-_Analog meter_ A class object for analog meters_ _manim _ani, file: 20260128_meterclass.py, line: 124}
      - {source: 32496c61-_increasing a number in steps_ How to increase a DecimalNumb, file: 20250603_decnum.py, line: 15}
    confidence: high
    applies_to: "Obowiązuje, gdy wartość początkowa ma od razu ustawić zależną geometrię lub tekst."

  - id: become-dla-geometrii
    topic: stan-i-updatery
