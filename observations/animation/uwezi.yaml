      - {source: 4939c503-_Better tracing_ Drawing a fading trace after an object_ _ma, file: 20230114_trace.py, line: 29}
    confidence: high
    applies_to: "Obowiązuje dla ruchu, zegara, odtwarzania mediów i efektów zależnych od wieku elementu."

  - id: formy-updaterow
    topic: stan-i-updatery
    rule: "Umieszczaj logikę współdzieloną w metodzie obiektu, logikę lokalną sceny w nazwanej funkcji, a krótkie przeliczenia zapisuj jako lambdy."
    falsifiable: true
    evidence:
      - {source: 80eef467-_Analog meter_ A class object for analog meters_ _manim _ani, file: 20260128_meterclass.py, line: 126}
      - {source: 0058db42-_scanning a magnifier over a chip_ _manim _valuetracker _ima, file: 20230604_chipmagni.py, line: 22}
