    applies_to: Obowiązuje, gdy późniejsza faza modyfikuje lub ponownie wykorzystuje obiekty z wcześniejszej fazy.

  - id: layout-relacyjny
    topic: kompozycja
    rule: Ustalaj układ kadru relacyjnie przez `next_to`, `arrange` i `to_edge`, a ruchome etykiety dowiązuj updaterem.
    falsifiable: true
    evidence:
      - {source: _2019/diffyq, file: part1/pendulum.py, line: 452}
      - {source: _2019/diffyq, file: part1/pendulum.py, line: 453}
      - {source: _2019/diffyq, file: part2/heat_equation.py, line: 227}
      - {source: _2019/diffyq, file: part2/heat_equation.py, line: 252}
