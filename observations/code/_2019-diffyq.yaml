    applies_to: Obowiązuje dla etykiet, grup i elementów zależnych od położenia innych obiektów.

  - id: obliczenia-w-scenie
    topic: dane-a-obraz
    rule: Wprowadzaj wynik obliczeń numerycznych jako funkcję próbkowaną podczas budowy lub aktualizacji obrazu zamiast jako statyczną tablicę danych.
    falsifiable: true
    evidence:
