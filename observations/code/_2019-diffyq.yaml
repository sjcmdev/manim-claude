      - {source: _2019/diffyq, file: part2/fourier_series.py, line: 484}
      - {source: _2019/diffyq, file: part2/fourier_series.py, line: 488}
      - {source: _2019/diffyq, file: part2/fourier_series.py, line: 492}
      - {source: _2019/diffyq, file: part4/long_fourier_scenes.py, line: 84}
      - {source: _2019/diffyq, file: part4/long_fourier_scenes.py, line: 97}
      - {source: _2019/diffyq, file: part4/long_fourier_scenes.py, line: 128}
    confidence: high
    applies_to: Obowiązuje dla serii ujęć wykonujących tę samą animację na wielu zewnętrznych kształtach.

  - id: niedokonczone-szkice
    topic: anty-wzorce
    rule: Usuwaj z modułów produkcyjnych puste sceny, metody `pass` i zaległe znaczniki TODO albo przenoś je do osobnego szkicownika.
    falsifiable: true
    evidence:
