      - {source: _2019/diffyq, file: part3/temperature_graphs.py, line: 2413}
      - {source: _2019/diffyq, file: part3/temperature_graphs.py, line: 2422}
      - {source: _2019/diffyq, file: part3/temperature_graphs.py, line: 2526}
    confidence: high
    applies_to: Obowiązuje dla scen, w których kilka obiektów wizualnych zależy od wspólnego parametru zmienianego w czasie.

  - id: jawne-wiazanie-stanu
    topic: stan-i-updatery
    rule: Rozdzielaj jawne metody wiążące stan modelu z obrazem oraz obraz z modelem.
    falsifiable: true
    evidence:
      - {source: _2019/diffyq, file: part1/phase_space.py, line: 451}
      - {source: _2019/diffyq, file: part1/phase_space.py, line: 456}
      - {source: _2019/diffyq, file: part1/phase_space.py, line: 461}
      - {source: _2019/diffyq, file: part1/phase_space.py, line: 474}
    confidence: high
    applies_to: Obowiązuje, gdy interakcja lub animacja może sterować stanem matematycznym w więcej niż jednym kierunku.

  - id: stan-miedzy-fazami
    topic: kompozycja
    rule: Zapisuj długowieczne obiekty i grupy jako atrybuty sceny, aby kolejne fazy korzystały z tego samego stanu.
    falsifiable: true
    evidence:
      - {source: _2019/diffyq, file: part1/pendulum.py, line: 404}
      - {source: _2019/diffyq, file: part1/pendulum.py, line: 470}
      - {source: _2019/diffyq, file: part1/pendulum.py, line: 538}
      - {source: _2019/diffyq, file: part2/heat_equation.py, line: 196}
      - {source: _2019/diffyq, file: part2/heat_equation.py, line: 209}
