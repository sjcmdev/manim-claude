observations:
  - id: manifest-czesci
    topic: dekompozycja
    rule: Trzymaj kolejność ujęć i katalog wyjściowy w osobnym module `all_partN_scenes.py`, a sceny importuj z modułów tematycznych.
    falsifiable: true
    evidence:
      - {source: _2019/diffyq, file: all_part1_scenes.py, line: 1}
      - {source: _2019/diffyq, file: all_part1_scenes.py, line: 8}
      - {source: _2019/diffyq, file: all_part2_scenes.py, line: 1}
      - {source: _2019/diffyq, file: all_part2_scenes.py, line: 8}
      - {source: _2019/diffyq, file: all_part4_scenes.py, line: 1}
      - {source: _2019/diffyq, file: all_part4_scenes.py, line: 12}
    confidence: high
    applies_to: Obowiązuje, gdy jeden film lub rozdział składa się z wielu modułów scen.

  - id: fazy-construct
    topic: dekompozycja
    rule: Rozbij `construct` na nazwane metody faz i wywołuj je w kolejności montażu.
    falsifiable: true
    evidence:
      - {source: _2019/diffyq, file: part1/pendulum.py, line: 384}
      - {source: _2019/diffyq, file: part1/pendulum.py, line: 390}
      - {source: _2019/diffyq, file: part2/heat_equation.py, line: 178}
      - {source: _2019/diffyq, file: part2/heat_equation.py, line: 184}
      - {source: _2019/diffyq, file: part2/heat_equation.py, line: 474}
      - {source: _2019/diffyq, file: part2/heat_equation.py, line: 481}
    confidence: high
    applies_to: Obowiązuje dla scen zawierających kilka kolejnych etapów budowy lub animacji kadru.

  - id: wspolne-konstrukcje
    topic: ponowne-uzycie
    rule: Umieszczaj współdzielone obiekty, formuły i funkcje obliczeniowe w `shared_constructs.py` i importuj je do modułów scen.
    falsifiable: true
    evidence:
      - {source: _2019/diffyq, file: part1/shared_constructs.py, line: 19}
      - {source: _2019/diffyq, file: part1/shared_constructs.py, line: 48}
      - {source: _2019/diffyq, file: part1/phase_space.py, line: 2}
      - {source: _2019/diffyq, file: part1/phase_space.py, line: 298}
      - {source: _2019/diffyq, file: part1/wordy_scenes.py, line: 256}
      - {source: _2019/diffyq, file: part2/shared_constructs.py, line: 11}
      - {source: _2019/diffyq, file: part2/heat_equation.py, line: 2}
    confidence: high
    applies_to: Obowiązuje dla konstrukcji używanych przez co najmniej dwie sceny tego samego rozdziału.

  - id: warianty-przez-dziedziczenie
    topic: ponowne-uzycie
    rule: Parametryzuj różnice wariantów przez `CONFIG` i dziedzicz gotowy przebieg sceny zamiast kopiować `construct`.
    falsifiable: true
    evidence:
      - {source: _2019/diffyq, file: part1/pendulum.py, line: 737}
      - {source: _2019/diffyq, file: part1/pendulum.py, line: 830}
      - {source: _2019/diffyq, file: part1/pendulum.py, line: 849}
      - {source: _2019/diffyq, file: part2/fourier_series.py, line: 263}
      - {source: _2019/diffyq, file: part2/fourier_series.py, line: 295}
      - {source: _2019/diffyq, file: part3/temperature_graphs.py, line: 2476}
      - {source: _2019/diffyq, file: part3/temperature_graphs.py, line: 2533}
    confidence: high
    applies_to: Obowiązuje, gdy kilka ujęć ma ten sam układ i animację, ale inne parametry, kształt lub tempo.

  - id: parametry-na-poziomie-klasy
    topic: kompozycja
    rule: Trzymaj parametry geometrii, stylu i wariantu ujęcia w konfiguracji klasy zamiast rozpraszać je w `construct`.
    falsifiable: true
    evidence:
      - {source: _2019/diffyq, file: part1/pendulum.py, line: 6}
      - {source: _2019/diffyq, file: part1/pendulum.py, line: 45}
      - {source: _2019/diffyq, file: part1/pendulum.py, line: 738}
      - {source: _2019/diffyq, file: part2/fourier_series.py, line: 6}
      - {source: _2019/diffyq, file: part2/fourier_series.py, line: 267}
      - {source: _2019/diffyq, file: part2/heat_equation.py, line: 155}
      - {source: _2019/diffyq, file: part2/heat_equation.py, line: 173}
    confidence: high
    applies_to: Obowiązuje dla parametrów, które mają być zmieniane między renderami lub klasami scen.

  - id: tempo-z-konfiguracji
    topic: czas-i-tempo
    rule: Wyznaczaj czas ujęcia jednym atrybutem konfiguracji i przekazuj go do `wait` lub wspólnego helpera animacji.
    falsifiable: true
    evidence:
      - {source: _2019/diffyq, file: part2/fourier_series.py, line: 267}
      - {source: _2019/diffyq, file: part2/fourier_series.py, line: 283}
      - {source: _2019/diffyq, file: part2/heat_equation.py, line: 173}
      - {source: _2019/diffyq, file: part2/heat_equation.py, line: 320}
      - {source: _2019/diffyq, file: part2/heat_equation.py, line: 325}
      - {source: _2019/diffyq, file: part2/heat_equation.py, line: 327}
    confidence: high
    applies_to: Obowiązuje dla scen, w których kilka elementów animacji musi podążać za tym samym czasem symulacji.

  - id: symulacja-w-updaterze
    topic: stan-i-updatery
    rule: Włączaj ciągłą symulację updaterem komponentu i udostępniaj osobne metody jej uruchamiania oraz zatrzymywania.
    falsifiable: true
    evidence:
      - {source: _2019/diffyq, file: part1/pendulum.py, line: 178}
      - {source: _2019/diffyq, file: part1/pendulum.py, line: 181}
      - {source: _2019/diffyq, file: part1/pendulum.py, line: 184}
      - {source: _2019/diffyq, file: part1/pendulum.py, line: 196}
      - {source: _2019/diffyq, file: part1/pendulum.py, line: 405}
      - {source: _2019/diffyq, file: part1/pendulum.py, line: 810}
    confidence: high
    applies_to: Obowiązuje dla obiektów, których stan ma ewoluować przez cały czas trwania ujęcia.

  - id: tracker-jako-stan
    topic: stan-i-updatery
    rule: Trzymaj sterowalny skalar w `ValueTracker`, twórz zależną geometrię przez updater lub `always_redraw`, a animuj tracker.
    falsifiable: true
    evidence:
      - {source: _2019/diffyq, file: part1/pendulum.py, line: 1023}
      - {source: _2019/diffyq, file: part1/pendulum.py, line: 1024}
      - {source: _2019/diffyq, file: part1/pendulum.py, line: 1041}
      - {source: _2019/diffyq, file: part1/pendulum.py, line: 1158}
