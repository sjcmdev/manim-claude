    confidence: high
    applies_to: Obowiązuje dla pól, wykresów i trajektorii wyznaczanych przez jawny model matematyczny.

  - id: svg-jako-parametr
    topic: dane-a-obraz
    rule: Traktuj zewnętrzny kształt SVG jako parametr sceny i nadpisuj tylko metodę dostarczającą kształt lub ścieżkę.
    falsifiable: true
    evidence:
