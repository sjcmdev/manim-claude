      - {source: _2022/quintic, file: polynomial_baisics.py, line: 128}
      - {source: _2022/quintic, file: roots_and_coefs.py, line: 395}
      - {source: _2022/quintic, file: roots_and_coefs.py, line: 398}
    confidence: high
    applies_to: "Gdy animacja musi wybierać symbole lub termy z wieloczęściowego napisu matematycznego."