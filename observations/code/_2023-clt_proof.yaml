  - id: tracker-jako-zrodlo-stanu
    topic: stan-i-updatery
    rule: "Trzymaj wspólny parametr animacji w jednym `ValueTracker` i pobieraj jego wartość przez getter używany przez wszystkie zależne obiekty."
