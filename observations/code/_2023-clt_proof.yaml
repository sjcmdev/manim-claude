  - id: fabryka-geometrii-zaleznej-od-stanu
    topic: ponowne-uzycie
    rule: "Zamykaj generowanie powtarzalnej geometrii zależnej od stanu w parametryzowanej funkcji i wywołuj ją ponownie w updaterze."
