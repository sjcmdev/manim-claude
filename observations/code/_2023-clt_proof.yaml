    applies_to: "Obowiązuje, gdy jeden parametr steruje jednocześnie tekstem, wykresem lub geometrią próbek."

  - id: ciagly-ruch-jawne-cele
    topic: stan-i-updatery
    rule: "Używaj updatera do ciągłego ruchu, a przejścia do kolejnych wybranych wartości wykonuj jawnym `.animate.set_value(...)`."
