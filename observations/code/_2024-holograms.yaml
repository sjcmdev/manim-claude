      - {source: _2024/holograms, file: diffraction.py, line: 480}
      - {source: _2024/holograms, file: diffraction.py, line: 849}
      - {source: _2024/holograms, file: supplements.py, line: 267}
    confidence: high
    applies_to: "Obowiązuje, gdy kilka obiektów ma pojawić się w różnych momentach jednego ujęcia."

  - id: shader-i-obliczenia-pomocnicze
    topic: dane-a-obraz
    rule: "Trzymaj obliczenia per-piksel w shaderze, a osobną funkcję CPU utrzymuj tylko dla pomocniczych wykresów i pól wektorowych."
    falsifiable: true
    evidence:
      - {source: _2024/holograms, file: diffraction.py, line: 188}
      - {source: _2024/holograms, file: diffraction.py, line: 391}
      - {source: _2024/holograms, file: diffraction.wgsl, line: 52}
      - {source: _2024/holograms, file: diffraction.wgsl, line: 65}
    confidence: high
    applies_to: "Obowiązuje, gdy koszt obliczeń obrazu jest duży, ale potrzebna jest też geometria pomocnicza sterowana tym samym modelem."

  - id: stopniowe-wprowadzanie-danych
    topic: dane-a-obraz
    rule: "Przy dużym zbiorze punktów ograniczaj liczbę aktywnych danych i zwiększaj ją w trakcie animacji razem z aktualizacją obrazu."
    falsifiable: true
