      - {source: _2024/holograms, file: diffraction.py, line: 3508}
      - {source: _2024/holograms, file: diffraction.py, line: 3581}
      - {source: _2024/holograms, file: diffraction.py, line: 3587}
    confidence: high
    applies_to: "Obowiązuje, gdy pełny dataset jest zbyt duży, aby od razu pokazać go w animacji."

