observations:
  - id: baza-dla-sekwencji-3d
    topic: dekompozycja
    rule: "Wydzielaj wspólny setup 3D i fabryki geometrii do klasy bazowej, a kolejne ujęcia definiuj jako klasy scen dziedziczące po niej."
    falsifiable: true
    evidence:
      - {source: _2024/holograms, file: diffraction.py, line: 359}
      - {source: _2024/holograms, file: diffraction.py, line: 407}
      - {source: _2024/holograms, file: diffraction.py, line: 720}
      - {source: _2024/holograms, file: diffraction.py, line: 2829}
    confidence: high
    applies_to: "Obowiązuje, gdy kilka scen współdzieli oświetlenie kamery, geometrię ściany lub konstrukcję wykresów."

  - id: osobne-przerywniki
    topic: dekompozycja
    rule: "Umieszczaj samodzielne plansze, pytania i krótkie przerywniki w osobnym pliku, kodując każde ujęcie jako osobną klasę sceny."
    falsifiable: true
    evidence:
      - {source: _2024/holograms, file: supplements.py, line: 4}
      - {source: _2024/holograms, file: supplements.py, line: 151}
      - {source: _2024/holograms, file: supplements.py, line: 477}
      - {source: _2024/holograms, file: supplements.py, line: 974}
    confidence: high
    applies_to: "Obowiązuje, gdy materiał zawiera wiele krótkich ujęć pomocniczych niezależnych od głównej sekwencji."

  - id: czas-fali-w-obiekcie
    topic: stan-i-updatery
    rule: "Trzymaj ciągły parametr czasu w obiekcie renderującym, aktualizuj go przez updater i steruj pauzą zmianą tempa zamiast ręcznym przepisywaniem czasu."
    falsifiable: true
    evidence:
      - {source: _2024/holograms, file: diffraction.py, line: 94}
      - {source: _2024/holograms, file: diffraction.py, line: 158}
      - {source: _2024/holograms, file: diffraction.py, line: 165}
      - {source: _2024/holograms, file: diffraction.py, line: 183}
    confidence: high
    applies_to: "Obowiązuje, gdy parametr ma płynnie zmieniać się także podczas animowania innych obiektów."

  - id: obiekt-sterujacy-i-geometria-pochodna
    topic: stan-i-updatery
    rule: "Animuj jawnie obiekt sterujący lub tracker, a pozycję i kształt geometrii pochodnej wyliczaj w updaterze."
    falsifiable: true
    evidence:
      - {source: _2024/holograms, file: diffraction.py, line: 420}
      - {source: _2024/holograms, file: diffraction.py, line: 421}
      - {source: _2024/holograms, file: diffraction.py, line: 1375}
      - {source: _2024/holograms, file: diffraction.py, line: 1506}
    confidence: high
    applies_to: "Obowiązuje, gdy kilka elementów kadru musi stale podążać za jednym punktem, odcinkiem lub parametrem."

  - id: jawny-cykl-zycia-updaterow
    topic: stan-i-updatery
    rule: "Jawnie wznawiaj, zawieszaj i usuwaj updatery wtedy, gdy animacja ma zmienić ich obiekt bazowy albo zatrzymać zależną geometrię."
    falsifiable: true
    evidence:
      - {source: _2024/holograms, file: diffraction.py, line: 1005}
      - {source: _2024/holograms, file: diffraction.py, line: 1017}
      - {source: _2024/holograms, file: diffraction.py, line: 3164}
      - {source: _2024/holograms, file: diffraction.py, line: 3243}
    confidence: high
    applies_to: "Obowiązuje, gdy updater i jawna animacja mogłyby równocześnie modyfikować ten sam obiekt."

  - id: warianty-przez-kopiowanie
    topic: ponowne-uzycie
    rule: "Buduj warianty tej samej fali lub ekspozycji przez kopiowanie, dopasowanie punktów i przeniesienie uniformów zamiast powtarzać inicjalizację."
    falsifiable: true
    evidence:
      - {source: _2024/holograms, file: diffraction.py, line: 745}
      - {source: _2024/holograms, file: diffraction.py, line: 750}
      - {source: _2024/holograms, file: diffraction.py, line: 3595}
      - {source: _2024/holograms, file: diffraction.py, line: 3596}
    confidence: high
    applies_to: "Obowiązuje, gdy kilka obiektów ma wspólną geometrię i parametry, ale różni się źródłem, kryciem lub położeniem."

  - id: parametryzowany-model-fali
    topic: ponowne-uzycie
    rule: "Udostępniaj parametry modelu fali przez metody ustawiające, aby sceny zmieniały częstotliwość, długość fali, tłumienie i tempo bez sięgania do wnętrza uniformów."
    falsifiable: true
    evidence:
      - {source: _2024/holograms, file: diffraction.py, line: 64}
      - {source: _2024/holograms, file: diffraction.py, line: 121}
      - {source: _2024/holograms, file: diffraction.py, line: 137}
      - {source: _2024/holograms, file: diffraction.py, line: 162}
    confidence: high
    applies_to: "Obowiązuje, gdy ten sam typ obiektu jest używany w kilku scenach z innymi parametrami."

  - id: hierarchia-komponentu-kadru
    topic: kompozycja
    rule: "Łącz obrys, obraz i etykietę w grupy semantyczne, a pozycję etykiety wyprowadzaj względem całego komponentu."
    falsifiable: true
    evidence:
      - {source: _2024/holograms, file: supplements.py, line: 168}
      - {source: _2024/holograms, file: supplements.py, line: 174}
      - {source: _2024/holograms, file: supplements.py, line: 185}
      - {source: _2024/holograms, file: supplements.py, line: 250}
    confidence: high
    applies_to: "Obowiązuje, gdy jeden element wizualny składa się z ramki, zawartości i podpisu."

  - id: kotwice-dla-bitmap
    topic: kompozycja
    rule: "Dla adnotacji na fotografii trzymaj punkty kotwiczące jawnie, ale linie, okręgi i strzałki konstruuj z tych punktów."
    falsifiable: true
    evidence:
      - {source: _2024/holograms, file: supplements.py, line: 87}
      - {source: _2024/holograms, file: supplements.py, line: 95}
      - {source: _2024/holograms, file: supplements.py, line: 549}
      - {source: _2024/holograms, file: supplements.py, line: 565}
    confidence: high
    applies_to: "Obowiązuje, gdy geometria ma wskazywać miejsca na zewnętrznym obrazie lub nagraniu."

  - id: jawny-plan-kamery
    topic: kompozycja
    rule: "Zapisuj kolejne ujęcia 3D jako jawne etapy zmian orientacji i położenia kamery."
    falsifiable: true
