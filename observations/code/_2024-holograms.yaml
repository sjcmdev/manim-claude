      - {source: _2024/holograms, file: diffraction.py, line: 457}
      - {source: _2024/holograms, file: diffraction.py, line: 841}
      - {source: _2024/holograms, file: diffraction.py, line: 843}
    confidence: high
    applies_to: "Obowiązuje, gdy kamera prowadzi widza przez kolejne perspektywy tej samej sceny."

  - id: lokalne-i-globalne-tempo
    topic: czas-i-tempo
    rule: "Rozdzielaj czas całej sekwencji od lokalnych przedziałów wejścia i wyjścia poszczególnych animacji."
    falsifiable: true
