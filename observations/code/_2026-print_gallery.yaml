      - {source: _2026/print_gallery, file: exponential.py, line: 3501}
      - {source: _2026/print_gallery, file: exponential.py, line: 3502}
      - {source: _2026/print_gallery, file: exponential.py, line: 7}
    confidence: high
    applies_to: "Obowiązuje dla eksportu SVG, PNG i innych artefaktów pomocniczych tworzonych podczas renderu."

  - id: kalibracja-warstw-rastrowych
    topic: kompozycja
    rule: "Dla osobnych warstw rastrowych wymagających pikselowego nakładania zachowuj jawne rozmiary i pozycje każdej warstwy."
    falsifiable: true
