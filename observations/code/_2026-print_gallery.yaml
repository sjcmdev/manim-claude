      - {source: _2026/print_gallery, file: exponential.py, line: 165}
      - {source: _2026/print_gallery, file: exponential.py, line: 166}
    confidence: high
    applies_to: "Obowiązuje dla zestawu niezależnych obrazów rastrowych składających się na jedną kompozycję."
